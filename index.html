<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orangerie NK — Tagesübersicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --champagne: #FFF4EB;
    --sage: #91A995;
    --midnight: #011613;
    --aperol: #E95920;
    --blush: #FFA2BB;
    --citrone: #FDEA82;
    --rainforest: #01443F;
    --font: 'Poppins', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--midnight);
    color: var(--champagne);
    font-family: var(--font);
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 3vw 1.5vh;
    border-bottom: 1px solid rgba(145,169,149,0.25);
  }

  .logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .logo-main {
    font-size: 2.8vh;
    font-weight: 600;
    color: var(--aperol);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .logo-sub {
    font-size: 1.1vh;
    font-weight: 300;
    color: var(--sage);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-top: 0.2vh;
  }

  .header-center {
    text-align: center;
  }
  .date-label {
    font-size: 1.2vh;
    font-weight: 300;
    color: var(--sage);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 0.3vh;
  }
  .date-display {
    font-size: 3.2vh;
    font-weight: 600;
    color: var(--champagne);
    letter-spacing: 0.02em;
  }

  .header-right {
    text-align: right;
  }
  .clock {
    font-size: 4vh;
    font-weight: 300;
    color: var(--champagne);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  .last-updated {
    font-size: 1vh;
    color: var(--sage);
    font-weight: 300;
    margin-top: 0.3vh;
    letter-spacing: 0.1em;
  }

  /* ── Main grid ── */
  main {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  .panel {
    padding: 2.5vh 3vw;
    display: flex;
    flex-direction: column;
    gap: 1.5vh;
    overflow: hidden;
    min-height: 0;
  }

  .panel-left {
    border-right: 1px solid rgba(145,169,149,0.2);
  }

  .panel-title {
    font-size: 0.9vh;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--aperol);
    padding-bottom: 1vh;
    border-bottom: 1px solid rgba(233,89,32,0.25);
    flex-shrink: 0;
  }

  .scroll-area {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* ── Event cards ── */
  .event-card {
    background: rgba(145,169,149,0.08);
    border: 1px solid rgba(145,169,149,0.15);
    border-left: 3px solid var(--aperol);
    border-radius: 6px;
    padding: 1.5vh 1.8vw;
    margin-bottom: 1.2vh;
    transition: background 0.2s;
  }

  .event-card.status-definite { border-left-color: #00c875; }
  .event-card.status-handover { border-left-color: var(--citrone); }
  .event-card.status-scheduled { border-left-color: var(--sage); }
  .event-card.status-tentative { border-left-color: var(--blush); }

  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.8vh;
    gap: 1vw;
  }

  .event-name {
    font-size: 2vh;
    font-weight: 600;
    color: var(--champagne);
    line-height: 1.2;
  }

  .event-badges {
    display: flex;
    gap: 0.5vw;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .badge {
    font-size: 0.9vh;
    font-weight: 600;
    padding: 0.3vh 0.7vw;
    border-radius: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-status-definite { background: rgba(0,200,117,0.15); color: #00c875; border: 1px solid rgba(0,200,117,0.3); }
  .badge-status-handover { background: rgba(253,234,130,0.15); color: var(--citrone); border: 1px solid rgba(253,234,130,0.3); }
  .badge-status-scheduled { background: rgba(145,169,149,0.15); color: var(--sage); border: 1px solid rgba(145,169,149,0.3); }
  .badge-status-tentative { background: rgba(255,162,187,0.15); color: var(--blush); border: 1px solid rgba(255,162,187,0.3); }
  .badge-exclusive { background: rgba(233,89,32,0.15); color: var(--aperol); border: 1px solid rgba(233,89,32,0.3); }
  .badge-pax { background: rgba(1,68,63,0.4); color: var(--champagne); border: 1px solid rgba(145,169,149,0.2); }

  .event-meta {
    display: flex;
    gap: 1.5vw;
    flex-wrap: wrap;
    align-items: center;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 0.4vw;
    font-size: 1.3vh;
    font-weight: 300;
    color: var(--sage);
  }
  .meta-item .icon {
    font-size: 1.1vh;
    opacity: 0.7;
  }
  .meta-time { color: var(--champagne); font-weight: 400; }
  .meta-location { color: var(--champagne); }

  .event-notes {
    margin-top: 0.8vh;
    font-size: 1.2vh;
    font-weight: 300;
    color: rgba(255,244,235,0.6);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Reservation rows ── */
  .res-table {
    width: 100%;
    border-collapse: collapse;
  }

  .res-table thead tr {
    border-bottom: 1px solid rgba(145,169,149,0.2);
  }

  .res-table th {
    font-size: 0.85vh;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage);
    padding: 0 0.8vw 1vh 0;
    text-align: left;
  }

  .res-table td {
    padding: 1.2vh 0.8vw 1.2vh 0;
    vertical-align: top;
    border-bottom: 1px solid rgba(145,169,149,0.08);
  }

  .res-time {
    font-size: 2vh;
    font-weight: 600;
    color: var(--champagne);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .res-name {
    font-size: 1.6vh;
    font-weight: 400;
    color: var(--champagne);
  }
  .res-comment {
    font-size: 1.1vh;
    font-weight: 300;
    color: rgba(255,244,235,0.5);
    margin-top: 0.2vh;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .res-guests {
    font-size: 1.8vh;
    font-weight: 600;
    color: var(--champagne);
    text-align: center;
  }

  .res-status {
    text-align: right;
  }

  .status-dot {
    display: inline-block;
    width: 0.8vh;
    height: 0.8vh;
    border-radius: 50%;
    margin-right: 0.4vw;
    flex-shrink: 0;
  }
  .dot-confirmed { background: #00c875; }
  .dot-waiting { background: var(--citrone); }
  .dot-arrived { background: var(--aperol); }
  .dot-seated { background: var(--blush); }
  .dot-over { background: var(--sage); opacity: 0.5; }
  .dot-canceled { background: #df2f4a; }
  .dot-no_shown { background: rgba(145,169,149,0.3); }

  .status-label {
    font-size: 1vh;
    font-weight: 400;
    color: var(--sage);
    text-transform: capitalize;
  }

  /* ── Empty states ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 20vh;
    gap: 1vh;
    opacity: 0.4;
  }
  .empty-state .empty-icon { font-size: 3vh; }
  .empty-state .empty-text { font-size: 1.4vh; font-weight: 300; color: var(--sage); }

  /* ── Footer ── */
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1vh 3vw;
    border-top: 1px solid rgba(145,169,149,0.15);
    gap: 3vw;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    font-size: 1.1vh;
    font-weight: 300;
    color: var(--sage);
    letter-spacing: 0.05em;
  }
  .summary-chip .chip-num {
    font-size: 1.8vh;
    font-weight: 600;
    color: var(--champagne);
  }
  .summary-chip .chip-label { color: var(--sage); }
  .divider { width: 1px; height: 2vh; background: rgba(145,169,149,0.2); }

  /* ── Loading overlay ── */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--midnight);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 2vh;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 4vh; height: 4vh;
    border: 2px solid rgba(145,169,149,0.2);
    border-top-color: var(--aperol);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 1.2vh; color: var(--sage); font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }

  /* ── Error banner ── */
  .error-banner {
    background: rgba(223,47,74,0.1);
    border: 1px solid rgba(223,47,74,0.3);
    border-radius: 4px;
    padding: 0.8vh 1vw;
    font-size: 1vh;
    color: #df2f4a;
    margin-bottom: 1vh;
    display: none;
  }
  .error-banner.visible { display: block; }

  /* ── Highlight next upcoming event ── */
  .event-card.upcoming-next {
    background: rgba(233,89,32,0.07);
    border-color: rgba(233,89,32,0.3);
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Lade Tagesübersicht…</div>
</div>

<header>
  <div class="logo">
    <span class="logo-main">Orangerie</span>
    <span class="logo-sub">Neukölln</span>
  </div>
  <div class="header-center">
    <div class="date-label">Heute</div>
    <div class="date-display" id="dateDisplay">—</div>
  </div>
  <div class="header-right">
    <div class="clock" id="clock">00:00</div>
    <div class="last-updated" id="lastUpdated">—</div>
  </div>
</header>

<main>
  <!-- Events panel -->
  <div class="panel panel-left">
    <div class="panel-title">📅 &nbsp;Events heute</div>
    <div class="error-banner" id="eventsError"></div>
    <div class="scroll-area" id="eventsContainer">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">Lädt…</div>
      </div>
    </div>
  </div>

  <!-- Reservations panel -->
  <div class="panel panel-right">
    <div class="panel-title">🍽️ &nbsp;Reservierungen</div>
    <div class="error-banner" id="resError"></div>
    <div class="scroll-area" id="resContainer">
      <div class="empty-state">
        <div class="empty-icon">🔄</div>
        <div class="empty-text">Lädt…</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="summary-chip">
    <span class="chip-num" id="statEvents">—</span>
    <span class="chip-label">Events</span>
  </div>
  <div class="divider"></div>
  <div class="summary-chip">
    <span class="chip-num" id="statRes">—</span>
    <span class="chip-label">Reservierungen</span>
  </div>
  <div class="divider"></div>
  <div class="summary-chip">
    <span class="chip-num" id="statGuests">—</span>
    <span class="chip-label">Gäste total</span>
  </div>
  <div class="divider"></div>
  <div class="summary-chip">
    <span class="chip-num" id="statPax">—</span>
    <span class="chip-label">Event pax</span>
  </div>
</footer>

<script>
// ═══════════════════════════════════════════════
// CONFIG — fill these in before deploying
// ═══════════════════════════════════════════════
const CONFIG = {
  // Monday.com
  MONDAY_API_KEY: 'YOUR_MONDAY_API_KEY',
  MONDAY_BOARD_ID: '1721179729',

  // ZenChef
  ZENCHEF_TOKEN: 'YOUR_ZENCHEF_TOKEN',
  ZENCHEF_RESTAURANT_ID: 'YOUR_ZENCHEF_RESTAURANT_ID',
  ZENCHEF_HOST: 'https://api.zenchef.com/api/v1',

  // Refresh interval (ms)
  REFRESH_INTERVAL: 5 * 60 * 1000,
};

// ═══════════════════════════════════════════════
// Clock & date
// ═══════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function updateDateDisplay() {
  const now = new Date();
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function todayISO() {
  return new Date().toISOString().split('T')[0];
}

setInterval(updateClock, 1000);
updateClock();
updateDateDisplay();

// ═══════════════════════════════════════════════
// Monday.com — fetch today's events
// ═══════════════════════════════════════════════
async function fetchMondayEvents() {
  const today = todayISO();

  // Filter: Start date = today, status in [Definite, Handover, Scheduled, Tentative]
  // We fetch and filter client-side for date since monday date filters can be tricky
  const query = `
    query {
      boards(ids: [${CONFIG.MONDAY_BOARD_ID}]) {
        items_page(limit: 100, query_params: {
          rules: [
            { column_id: "date__1", compare_value: ["${today} 00:00:00", "${today} 23:59:59"], operator: between }
          ]
        }) {
          items {
            id
            name
            column_values(ids: [
              "date__1",
              "dup__of_start__1",
              "dropdown_mkkvf9ze",
              "dropdown_mkkc4t6r",
              "numbers__1",
              "deal_stage",
              "boolean_mkp7h8b7",
              "long_text__1",
              "long_text_mm3a6pym",
              "long_text_mm3a6vmt",
              "long_text_mm3at3et",
              "long_text_mkkv1mn5"
            ]) {
              id
              text
              value
            }
          }
        }
      }
    }
  `;

  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': CONFIG.MONDAY_API_KEY,
      'API-Version': '2024-01'
    },
    body: JSON.stringify({ query })
  });

  if (!res.ok) throw new Error(`Monday API ${res.status}`);
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);

  return data.data.boards[0].items_page.items;
}

// ═══════════════════════════════════════════════
// ZenChef — fetch today's reservations
// ═══════════════════════════════════════════════
async function fetchZenchefReservations() {
  const today = todayISO();
  const url = `${CONFIG.ZENCHEF_HOST}/bookings?` + new URLSearchParams({
    'filters[0][field]': 'day',
    'filters[0][operator]': '=',
    'filters[0][value]': today,
    'limit': '200',
    'page': '1',
    'sort[field]': 'time',
    'sort[order]': 'asc'
  });

  const res = await fetch(url, {
    headers: {
      'auth-token': CONFIG.ZENCHEF_TOKEN,
      'restaurantId': CONFIG.ZENCHEF_RESTAURANT_ID,
      'Content-Type': 'application/json'
    }
  });

  if (!res.ok) throw new Error(`ZenChef API ${res.status}`);
  const data = await res.json();
  // ZenChef returns { data: [...] } or an array directly
  return Array.isArray(data) ? data : (data.data || data.records || data.bookings || []);
}

// ═══════════════════════════════════════════════
// Render helpers
// ═══════════════════════════════════════════════
function getColumnValue(item, colId) {
  const col = item.column_values.find(c => c.id === colId);
  return col ? col.text : '';
}

function getColumnRawValue(item, colId) {
  const col = item.column_values.find(c => c.id === colId);
  return col ? col.value : null;
}

function formatTime(dateText) {
  if (!dateText) return '';
  // dateText from Monday might be "2024-05-22 18:00:00" or ISO
  const match = dateText.match(/(\d{2}:\d{2})/);
  return match ? match[1] : '';
}

function statusKey(statusText) {
  if (!statusText) return '';
  const t = statusText.toLowerCase();
  if (t.includes('definite')) return 'definite';
  if (t.includes('handover')) return 'handover';
  if (t.includes('scheduled')) return 'scheduled';
  if (t.includes('tentative')) return 'tentative';
  return 'other';
}

function statusBadgeClass(key) {
  return `badge badge-status-${key}`;
}

function statusLabel(key) {
  const map = { definite: 'Definite', handover: 'Handover', scheduled: 'Scheduled', tentative: 'Tentative', other: '' };
  return map[key] || key;
}

function dotClass(status) {
  const s = (status || '').toLowerCase();
  if (['confirmed'].includes(s)) return 'dot-confirmed';
  if (['waiting', 'waiting_customer'].includes(s)) return 'dot-waiting';
  if (s === 'arrived') return 'dot-arrived';
  if (s === 'seated') return 'dot-seated';
  if (s === 'over') return 'dot-over';
  if (['canceled', 'refused'].includes(s)) return 'dot-canceled';
  if (s === 'no_shown') return 'dot-no_shown';
  return 'dot-waiting';
}

function resStatusLabel(status) {
  const map = {
    confirmed: 'Bestätigt', waiting: 'Wartend', arrived: 'Angekommen',
    seated: 'Sitzend', over: 'Fertig', canceled: 'Abgesagt',
    no_shown: 'No-show', refused: 'Abgelehnt'
  };
  return map[(status||'').toLowerCase()] || status;
}

// ═══════════════════════════════════════════════
// Render Events
// ═══════════════════════════════════════════════
function renderEvents(items) {
  const container = document.getElementById('eventsContainer');
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  if (!items || items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌿</div>
        <div class="empty-text">Keine Events heute</div>
      </div>`;
    document.getElementById('statEvents').textContent = '0';
    document.getElementById('statPax').textContent = '0';
    return;
  }

  // Only show operational statuses
  const OPERATIONAL = ['definite'];
  items = items.filter(item => OPERATIONAL.includes(statusKey(getColumnValue(item, 'deal_stage'))));

  // Sort by start time
  const sorted = [...items].sort((a, b) => {
    const ta = getColumnValue(a, 'date__1');
    const tb = getColumnValue(b, 'date__1');
    return ta.localeCompare(tb);
  });

  let totalPax = 0;
  let nextIdx = -1;

  // Find "next upcoming" event
  for (let i = 0; i < sorted.length; i++) {
    const t = formatTime(getColumnValue(sorted[i], 'date__1'));
    if (t) {
      const [h, m] = t.split(':').map(Number);
      if (h * 60 + m >= nowMins) { nextIdx = i; break; }
    }
  }

  const html = sorted.map((item, idx) => {
    const name = item.name || '—';
    const start = formatTime(getColumnValue(item, 'date__1'));
    const end = formatTime(getColumnValue(item, 'dup__of_start__1'));
    const location = getColumnValue(item, 'dropdown_mkkvf9ze');
    const host = getColumnValue(item, 'dropdown_mkkc4t6r');
    const pax = getColumnValue(item, 'numbers__1');
    const status = getColumnValue(item, 'deal_stage');
    const exclusive = getColumnRawValue(item, 'boolean_mkp7h8b7');
    const setupInfo = getColumnValue(item, 'long_text__1');
    const ablauf = getColumnValue(item, 'long_text_mm3at3et');
    const calDesc = getColumnValue(item, 'long_text_mkkv1mn5');

    const sk = statusKey(status);
    const isExclusive = exclusive === 'true' || exclusive === '"true"';
    const paxNum = parseInt(pax) || 0;
    totalPax += paxNum;

    const noteText = calDesc || ablauf || setupInfo || '';
    const isNext = idx === nextIdx;

    return `
      <div class="event-card status-${sk}${isNext ? ' upcoming-next' : ''}">
        <div class="event-header">
          <div class="event-name">${escHtml(name)}</div>
          <div class="event-badges">
            ${paxNum ? `<span class="badge badge-pax">👥 ${paxNum}</span>` : ''}
            ${sk ? `<span class="${statusBadgeClass(sk)}">${statusLabel(sk)}</span>` : ''}
            ${isExclusive ? `<span class="badge badge-exclusive">Exklusiv</span>` : ''}
          </div>
        </div>
        <div class="event-meta">
          ${start ? `<span class="meta-item"><span class="icon">🕐</span><span class="meta-time">${start}${end ? ' – ' + end : ''}</span></span>` : ''}
          ${location ? `<span class="meta-item"><span class="icon">📍</span><span class="meta-location">${escHtml(location)}</span></span>` : ''}
          ${host ? `<span class="meta-item"><span class="icon">👤</span>${escHtml(host)}</span>` : ''}
        </div>
        ${noteText ? `<div class="event-notes">${escHtml(noteText)}</div>` : ''}
      </div>`;
  }).join('');

  container.innerHTML = html;
  document.getElementById('statEvents').textContent = sorted.length;
  document.getElementById('statPax').textContent = totalPax || '—';
}

// ═══════════════════════════════════════════════
// Render Reservations
// ═══════════════════════════════════════════════
function renderReservations(bookings) {
  const container = document.getElementById('resContainer');

  // Filter out canceled/no_shown for cleaner display (keep them but style differently)
  const active = (bookings || []).filter(b => !['refused'].includes((b.status||'').toLowerCase()));

  if (!active || active.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌿</div>
        <div class="empty-text">Keine Reservierungen heute</div>
      </div>`;
    document.getElementById('statRes').textContent = '0';
    document.getElementById('statGuests').textContent = '0';
    return;
  }

  const totalGuests = active.reduce((s, b) => s + (parseInt(b.nb_guests) || 0), 0);

  const rows = active.map(b => {
    const time = (b.time || '').slice(0, 5);
    const name = [b.firstname, b.lastname].filter(Boolean).join(' ') || '—';
    const guests = b.nb_guests || '—';
    const status = b.status || 'confirmed';
    const comment = b.comment || '';

    return `
      <tr>
        <td><div class="res-time">${escHtml(time)}</div></td>
        <td>
          <div class="res-name">${escHtml(name)}</div>
          ${comment ? `<div class="res-comment">${escHtml(comment)}</div>` : ''}
        </td>
        <td><div class="res-guests">${guests}</div></td>
        <td class="res-status">
          <span class="status-dot ${dotClass(status)}"></span>
          <span class="status-label">${resStatusLabel(status)}</span>
        </td>
      </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="res-table">
      <thead>
        <tr>
          <th>Zeit</th>
          <th>Name</th>
          <th style="text-align:center">PAX</th>
          <th style="text-align:right">Status</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  document.getElementById('statRes').textContent = active.length;
  document.getElementById('statGuests').textContent = totalGuests;
}

// ═══════════════════════════════════════════════
// HTML escape
// ═══════════════════════════════════════════════
function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════
// Main fetch & render cycle
// ═══════════════════════════════════════════════
async function refresh() {
  const eventsErr = document.getElementById('eventsError');
  const resErr = document.getElementById('resError');

  // Fetch both in parallel
  const [eventsResult, resResult] = await Promise.allSettled([
    fetchMondayEvents(),
    fetchZenchefReservations()
  ]);

  if (eventsResult.status === 'fulfilled') {
    eventsErr.classList.remove('visible');
    renderEvents(eventsResult.value);
  } else {
    console.error('Monday error:', eventsResult.reason);
    eventsErr.textContent = `Fehler: ${eventsResult.reason.message}`;
    eventsErr.classList.add('visible');
    renderEvents([]);
  }

  if (resResult.status === 'fulfilled') {
    resErr.classList.remove('visible');
    renderReservations(resResult.value);
  } else {
    console.error('ZenChef error:', resResult.reason);
    resErr.textContent = `Fehler: ${resResult.reason.message}`;
    resErr.classList.add('visible');
    renderReservations([]);
  }

  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    `Aktualisiert ${now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}`;

  // Hide loading screen
  document.getElementById('loading').classList.add('hidden');
}

// ═══════════════════════════════════════════════
// Auto-refresh every 5 min
// ═══════════════════════════════════════════════
refresh();
setInterval(refresh, CONFIG.REFRESH_INTERVAL);

// Also refresh at midnight to reset the date
const now = new Date();
const msToMidnight = (24*60*60*1000) - (now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds())*1000;
setTimeout(() => { updateDateDisplay(); refresh(); setInterval(() => { updateDateDisplay(); refresh(); }, 24*60*60*1000); }, msToMidnight);
</script>
